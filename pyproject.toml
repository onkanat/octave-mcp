[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 99

[tool.isort]
profile = "black"


[project]
name = "octave-mcp"
version = "0.3.1"
requires-python = ">=3.11"
description = "OctaveMCP: Secure GNU Octave code execution via MCP with FastMCP + FastAPI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hakan Kılıçaslan", email = "hakan@example.com"}
]
keywords = ["octave", "mcp", "code-execution", "fastapi", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters"
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "gunicorn",
    "requests",
    "python-dotenv",
    "httpx",
    "mcp>=1.8.0"
]

[project.urls]
Homepage = "https://onkanat.github.io/octave-mcp"
Documentation = "https://onkanat.github.io/octave-mcp"
Repository = "https://github.com/onkanat/octave-mcp"
Issues = "https://github.com/onkanat/octave-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "coverage[toml]>=7.0.0"
]

[project.scripts]
octave-mcp = "mcp_server:main"
octave-mcp-cli = "cli.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=90"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "contract: Contract tests",
    "slow: Slow running tests",
    "external: Tests requiring external services"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


