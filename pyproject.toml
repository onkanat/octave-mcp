[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 99

[tool.isort]
profile = "black"


[project]
name = "octave-mcp"
version = "0.2.0"
requires-python = ">=3.11"
description = "OctaveMCP: Secure GNU Octave code execution via MCP with FastMCP + FastAPI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hakan Kılıçaslan", email = "hakan@example.com"}
]
keywords = ["octave", "mcp", "code-execution", "fastapi", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters"
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "gunicorn",
    "requests",
    "python-dotenv",
    "httpx",
    "mcp>=1.8.0"
]

[project.urls]
Homepage = "https://onkanat.github.io/octave-mcp"
Documentation = "https://onkanat.github.io/octave-mcp"
Repository = "https://github.com/onkanat/octave-mcp"
Issues = "https://github.com/onkanat/octave-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8"
]

[project.scripts]
octave-mcp = "src.mcp_server:main"


